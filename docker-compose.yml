version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: fabric-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - type: bind
        source: ${DATASET_HOST_DIR:-C:/Users/visha/Desktop/weave data/FinalFabric/cleaned}
        target: /data/cleaned
        read_only: true
    environment:
      APP_ENV: development
      DATASET_DIR: /data/cleaned
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fabric_reconstruction
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: fabric-frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: fabric-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fabric_reconstruction
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fabric_reconstruction"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
